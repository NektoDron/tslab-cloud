<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TSLab</title>
    <script>
      // SPA fallback for a stray history-style deep path. Convert it to the hash route.
      // No hashed bundle refs -> a cached copy can't go stale.
      (function () {
        var base = "/tslab-cloud/app/";
        var p = location.pathname;
        var sub = p.indexOf(base) === 0 ? p.slice(base.length) : '';
        location.replace(base + '#/' + sub + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>

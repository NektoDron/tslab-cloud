<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TSLab</title>
    <script>
      // Real 200 file at /auth/callback so GitHub never falls through to its sticky stale 404 page.
      // Hash routing -> redirect straight to the hash route carrying ?code=&state=, so the router
      // resolves AuthCallback immediately. No hashed bundle refs -> a cached copy can't go stale.
      location.replace("/tslab-cloud/app/#/auth/callback" + location.search);
    </script>
  </head>
  <body></body>
</html>
